<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyPC Script Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#62B134; --green-dk:#4d8c29; --green-deep:#345c1e; --green-soft:rgba(98,177,52,.10);
  --bg:#ffffff; --surface:#f6f7f5; --surface-2:#eceee9; --surface-3:#e4e6df;
  --ink:#0b0b0b; --ink-2:#3d423b; --ink-3:#6b7166;
  --line:#dcded8; --line-strong:#c7cabf;
  --amber:#9a6b0c; --blue:#2c6b9e; --red:#b3402f;
  --seg-hook:#62B134; --seg-problem:#b8632b; --seg-solution:#6b7166; --seg-outro:#2c6b9e;
  --font-ui:'Open Sans',sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0c0a; --surface:#141613; --surface-2:#1c1f1a; --surface-3:#22261f;
    --ink:#f2f4f0; --ink-2:#c8ccc3; --ink-3:#8f958a;
    --line:#2b2f28; --line-strong:#3a3f35;
    --amber:#e6b422; --blue:#6fb3e8; --red:#ff8a76;
    --seg-hook:#62B134; --seg-problem:#e08a52; --seg-solution:#9aa094; --seg-outro:#6fb3e8;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0c0a; --surface:#141613; --surface-2:#1c1f1a; --surface-3:#22261f;
  --ink:#f2f4f0; --ink-2:#c8ccc3; --ink-3:#8f958a;
  --line:#2b2f28; --line-strong:#3a3f35;
  --amber:#e6b422; --blue:#6fb3e8; --red:#ff8a76;
  --seg-hook:#62B134; --seg-problem:#e08a52; --seg-solution:#9aa094; --seg-outro:#6fb3e8;
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-ui); line-height:1.6; font-size:15px;}
:focus-visible{outline:2px solid var(--green); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

.mono{font-family:var(--font-mono);}

/* ---------- topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:14px;
  padding:14px 20px; background:var(--bg);
  border-bottom:1px solid var(--line);
}
.topbar .mark{
  width:34px; height:34px; border-radius:8px; flex-shrink:0;
  background:linear-gradient(135deg,var(--green) 0%, var(--green-deep) 100%);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:800; font-size:15px; font-family:var(--font-mono);
}
.topbar .titles{flex:1; min-width:0;}
.topbar h1{margin:0; font-size:16px; font-weight:800; letter-spacing:-.01em;}
.topbar .sub{margin:0; font-size:11.5px; color:var(--ink-3); font-family:var(--font-mono);}
.topbar .actions{display:flex; align-items:center; gap:8px;}
.iconbtn{
  display:flex; align-items:center; gap:6px;
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line);
  border-radius:8px; padding:7px 12px; font-size:12.5px; font-weight:600;
  cursor:pointer; font-family:var(--font-ui);
}
.iconbtn:hover{background:var(--surface-3); color:var(--ink);}

/* ---------- subnav / tabs ---------- */
.subnav{
  display:flex; gap:20px; max-width:1280px; margin:0 auto;
  padding:10px 20px 0; border-bottom:1px solid var(--line);
}
.tab-btn{
  background:transparent; border:none; border-bottom:2px solid transparent;
  padding:8px 2px 10px; font-family:var(--font-ui); font-size:13.5px; font-weight:700;
  color:var(--ink-3); cursor:pointer;
}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--ink); border-color:var(--green);}

/* ---------- monthly report ---------- */
.report-wrap{max-width:1280px; margin:0 auto; padding:22px 24px 60px;}
.report-head{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:18px;}
.report-head h2{margin:0; font-size:19px; font-weight:800;}
.report-filters{display:flex; gap:8px; flex-wrap:wrap;}
.report-filters select{
  padding:8px 11px; border:1px solid var(--line); border-radius:8px;
  background:var(--surface); color:var(--ink); font-family:var(--font-ui); font-size:13px;
}
.report-table{border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
.report-row{display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--surface);}
.report-row:last-child{border-bottom:none;}
.report-row.total{background:var(--surface-2); font-weight:700;}
.report-pname{width:190px; flex-shrink:0; font-size:13.5px; font-weight:700;}
.report-bar-track{flex:1; height:8px; border-radius:4px; background:var(--surface-3); overflow:hidden;}
.report-bar-fill{height:100%; background:var(--green); border-radius:4px;}
.report-nums{font-family:var(--font-mono); font-size:12px; color:var(--ink-2); width:150px; text-align:right; flex-shrink:0;}
@media (max-width:640px){
  .report-row{flex-wrap:wrap;}
  .report-pname{width:100%;}
  .report-nums{width:auto;}
}

/* ---------- layout ---------- */
.layout{display:flex; align-items:flex-start; max-width:1280px; margin:0 auto;}
.sidebar{
  width:250px; flex-shrink:0; position:sticky; top:65px;
  height:calc(100vh - 65px); overflow-y:auto;
  padding:18px 14px 24px; border-right:1px solid var(--line);
}
.main{flex:1; min-width:0; padding:20px 24px 60px;}

.ring-card{
  display:flex; align-items:center; gap:12px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; margin-bottom:18px;
}
.ring-card svg{flex-shrink:0; transform:rotate(-90deg);}
.ring-card .ring-fill{transition:stroke-dashoffset .5s ease;}
.ring-num{font-family:var(--font-mono); font-size:19px; font-weight:700;}
.ring-label{font-size:11px; color:var(--ink-3); line-height:1.4; margin-top:2px;}

.side-search{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
  background:var(--surface); color:var(--ink); font-family:var(--font-ui); font-size:13px;
  margin-bottom:12px;
}
.pill-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px;}
.pill{
  border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  border-radius:20px; padding:5px 11px; font-size:11.5px; font-weight:600;
  cursor:pointer; font-family:var(--font-ui);
}
.pill:hover{border-color:var(--line-strong);}
.pill.active{background:var(--green); border-color:var(--green); color:#fff;}

.side-heading{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3);
  font-family:var(--font-mono); margin:0 0 8px; padding-top:2px;
}
.pillar-list{display:flex; flex-direction:column; gap:3px; margin-bottom:18px;}
.pillar-row{
  display:flex; flex-direction:column; gap:5px; text-align:left;
  background:transparent; border:1px solid transparent; border-radius:8px;
  padding:7px 9px; cursor:pointer; font-family:var(--font-ui);
}
.pillar-row:hover{background:var(--surface);}
.pillar-row.active{background:var(--green-soft); border-color:var(--green);}
.pillar-row .row1{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
.pillar-row .pname{font-size:12.5px; font-weight:700; color:var(--ink);}
.pillar-row .pcount{font-size:10.5px; color:var(--ink-3); font-family:var(--font-mono); flex-shrink:0;}
.pillar-row .pbar{height:4px; border-radius:3px; background:var(--surface-3); overflow:hidden;}
.pillar-row .pbar-fill{height:100%; background:var(--green); border-radius:3px;}

.legend{display:flex; flex-direction:column; gap:6px; padding-top:10px; border-top:1px solid var(--line);}
.legend .item{display:flex; align-items:center; gap:7px; font-size:11px; color:var(--ink-3);}
.legend .dot{width:8px; height:8px; border-radius:2px; flex-shrink:0;}

/* ---------- status line ---------- */
.status-line{font-size:12px; color:var(--ink-3); margin:0 0 16px; font-family:var(--font-mono);}
.status-line.error{color:var(--red);}
.empty-state{text-align:center; padding:60px 20px; color:var(--ink-3); font-size:14px;}

/* ---------- pillar section ---------- */
h2.pillar-head{
  display:flex; justify-content:space-between; align-items:baseline; gap:12px;
  border-bottom:2px solid var(--ink); padding-bottom:9px; margin:34px 0 16px; font-size:19px; font-weight:800;
}
h2.pillar-head:first-child{margin-top:0;}
.pillar-count-tag{font-size:12px; font-weight:600; color:var(--ink-3); font-family:var(--font-mono);}

/* ---------- script card ---------- */
.script-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  margin:12px 0; overflow:hidden;
}
.script-card summary{
  cursor:pointer; padding:14px 16px 12px; list-style:none;
  display:flex; flex-direction:column; gap:9px;
}
.script-card summary::-webkit-details-marker{display:none;}
.summary-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
.summary-title{font-weight:700; font-size:14.5px; flex:1;}
.summary-meta{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.plus{font-size:16px; color:var(--ink-3); font-weight:700; flex-shrink:0; font-family:var(--font-mono);}
.script-card[open] .plus::before{content:"\2212";}
.plus::before{content:"+";}

.tag{
  display:inline-block; padding:2px 9px; border-radius:20px; font-size:10px; font-weight:700;
  text-transform:uppercase; letter-spacing:.03em; font-family:var(--font-mono);
}
.tag.status-draft{background:rgba(154,107,12,.14); color:var(--amber);}
.tag.status-approved{background:var(--green-soft); color:var(--green-dk);}
.tag.status-published{background:rgba(44,107,158,.14); color:var(--blue);}
.date-tag{font-size:10.5px; color:var(--ink-3); font-family:var(--font-mono); white-space:nowrap;}

.produced-badge{
  display:inline-flex; align-items:center; gap:4px;
  font-family:var(--font-mono); font-size:10px; font-weight:600; white-space:nowrap;
  padding:2px 8px; border-radius:20px; border:1px solid var(--line);
}
.produced-badge.is-no{color:var(--ink-3); background:var(--surface-2);}
.produced-badge.is-yes{color:var(--green-dk); background:var(--green-soft); border-color:var(--green);}

.script-card .body{padding:2px 16px 18px;}
.edit-row{display:flex; flex-wrap:wrap; gap:14px; padding:10px 12px; margin:8px 0 4px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px;}
.edit-row label{display:flex; flex-direction:column; gap:3px; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); font-family:var(--font-mono);}
.edit-row select{
  padding:6px 8px; border:1px solid var(--line); border-radius:6px;
  background:var(--surface); color:var(--ink); font-family:var(--font-ui); font-size:12.5px;
}
.phase{border-left:3px solid var(--line); border-radius:0 6px 6px 0; padding:9px 13px; margin:10px 0; background:var(--surface-2);}
.phase.p-hook{border-color:var(--seg-hook);}
.phase.p-problem{border-color:var(--seg-problem);}
.phase.p-solution{border-color:var(--seg-solution);}
.phase.p-outro{border-color:var(--seg-outro);}
.phase-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px;}
.phase-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--ink-2);}
.phase-time{font-size:10px; color:var(--ink-3); font-family:var(--font-mono);}
.phase-text{margin:0; font-size:13.5px; white-space:pre-wrap; color:var(--ink);}

h3.seg{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); font-family:var(--font-mono); margin:18px 0 8px; padding-top:14px; border-top:1px solid var(--line);}

.shotlist{border:1px solid var(--line); border-radius:8px; overflow:hidden;}
.shot-row{display:flex; gap:12px; padding:6px 12px; font-size:13px;}
.shot-row:nth-child(odd){background:var(--surface-2);}
.shot-time{font-family:var(--font-mono); font-size:11.5px; color:var(--green-dk); flex-shrink:0; width:64px;}
.shot-desc{color:var(--ink-2);}

.broll-panel{border:1px solid var(--line); border-radius:8px; padding:10px 13px; margin-bottom:8px;}
.broll-panel:last-child{margin-bottom:0;}
.broll-label{font-family:var(--font-mono); font-size:10.5px; font-weight:700; color:var(--green-dk); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;}
.broll-text{margin:0; font-size:13px; color:var(--ink-2);}

.caption-box{background:var(--surface-2); border-radius:8px; padding:11px 14px; font-size:13.5px; font-style:italic; color:var(--ink-2);}

.thumb-box{border:1px solid var(--line); border-radius:8px; overflow:hidden;}
.thumb-row{display:flex; gap:12px; padding:8px 13px; font-size:13px;}
.thumb-row:nth-child(odd){background:var(--surface-2);}
.thumb-key{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-3); width:100px; flex-shrink:0; text-transform:uppercase; letter-spacing:.03em; padding-top:1px;}
.thumb-val{color:var(--ink);}

footer.foot{max-width:1280px; margin:0 auto; padding:20px 24px 40px; font-size:11.5px; color:var(--ink-3); font-family:var(--font-mono);}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .layout{flex-direction:column;}
  .sidebar{
    width:100%; height:auto; position:static; border-right:none; border-bottom:1px solid var(--line);
    padding:14px 18px;
  }
  .ring-card{margin-bottom:12px;}
  .pillar-list{flex-direction:row; flex-wrap:nowrap; overflow-x:auto; gap:8px; padding-bottom:4px;}
  .pillar-row{flex-shrink:0; min-width:150px;}
  .legend{flex-direction:row; flex-wrap:wrap; gap:12px;}
  .main{padding:18px 18px 50px;}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="mark">PC</div>
  <div class="titles">
    <h1>EasyPC Script Library</h1>
    <p class="sub">tech it easy — content ops</p>
  </div>
  <div class="actions">
    <button class="iconbtn" onclick="loadData()">&#8635; Refresh</button>
    <button class="iconbtn" onclick="tt()">&#9788; / &#9789;</button>
  </div>
</header>

<nav class="subnav">
  <button class="tab-btn active" data-tab="scripts" onclick="showTab('scripts')">Scripts</button>
  <button class="tab-btn" data-tab="report" onclick="showTab('report')">Monthly Report</button>
</nav>

<div class="layout" id="scriptsView">

  <aside class="sidebar">
    <div class="ring-card">
      <svg width="56" height="56" viewBox="0 0 56 56">
        <circle cx="28" cy="28" r="23" fill="none" stroke="var(--surface-3)" stroke-width="5"/>
        <circle id="ringFill" class="ring-fill" cx="28" cy="28" r="23" fill="none" stroke="var(--green)" stroke-width="5" stroke-linecap="round" stroke-dasharray="144.5" stroke-dashoffset="144.5"/>
      </svg>
      <div>
        <div class="ring-num" id="ringNum">0/40</div>
        <div class="ring-label">Approved + Published<br>this month</div>
      </div>
    </div>

    <input type="search" id="searchBox" class="side-search" placeholder="Search topics..." oninput="render()">

    <p class="side-heading">Status</p>
    <div class="pill-row" id="statusPills"></div>

    <p class="side-heading">Produced</p>
    <div class="pill-row" id="producedPills"></div>

    <p class="side-heading">Month</p>
    <select id="monthFilter" class="side-search" onchange="activeMonth = this.value; render();">
      <option value="all">All Months</option>
    </select>

    <p class="side-heading">Pillar</p>
    <div class="pillar-list" id="pillarList"></div>

    <div class="legend">
      <div class="item"><span class="dot" style="background:var(--seg-hook)"></span>Hook 0-3s</div>
      <div class="item"><span class="dot" style="background:var(--seg-problem)"></span>Problem 3-10s</div>
      <div class="item"><span class="dot" style="background:var(--seg-solution)"></span>Solution 10-40s</div>
      <div class="item"><span class="dot" style="background:var(--seg-outro)"></span>Outro 40-50s</div>
    </div>
  </aside>

  <main class="main">
    <p class="status-line" id="statusLine">&nbsp;</p>
    <div id="content"></div>
  </main>

</div>

<section class="report-wrap" id="reportView" style="display:none;">
  <div class="report-head">
    <h2>Monthly Production Report</h2>
    <div class="report-filters">
      <select id="reportMonthFilter" onchange="reportMonth = this.value; renderReport();"></select>
      <select id="reportPillarFilter" onchange="reportPillar = this.value; renderReport();"></select>
    </div>
  </div>
  <div id="reportBody"></div>
</section>

<footer class="foot">Connects to the Google Sheet via an Apps Script Web App — click Refresh to see new rows.</footer>

<script>
  const MONTHLY_TARGET = 40;
  // edit here if monthly per-pillar quotas change
  const PILLAR_TARGETS = {
    'Tech How-Tos': 5,
    'Mistake Avoidance': 5,
    'Useful Tools': 5,
    'Pro-Insights': 6,
    'Wow Factor Technology': 4,
    'High End Build Features': 4,
    'Customer Stories': 4,
  };
  const STATUS_OPTIONS = [
    { val:'approved_published', label:'Approved+Published' },
    { val:'all', label:'All' },
    { val:'Draft', label:'Draft' },
    { val:'Approved', label:'Approved' },
    { val:'Published', label:'Published' },
  ];
  const PRODUCED_OPTIONS = [
    { val:'all', label:'All' },
    { val:'no', label:'Not Produced' },
    { val:'yes', label:'Produced' },
  ];
  // Embedded backend endpoint — not shown in the UI.
  const API_URL = "https://script.google.com/macros/s/AKfycbw0BE344Ds8OMnaK5EZ3zbRS_ToYGqf0EELwW_UkerTxvq2AFhjw_xlhQJEVdmbM3ZF3A/exec";

  const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  let allRows = [];
  let activeStatus = 'approved_published';
  let activePillar = 'all';
  let activeMonth = 'all';
  let activeProduced = 'all';
  let reportMonth = 'all';
  let reportPillar = 'all';

  function showTab(tab){
    document.getElementById('scriptsView').style.display = tab === 'scripts' ? '' : 'none';
    document.getElementById('reportView').style.display = tab === 'report' ? '' : 'none';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    if (tab === 'report') renderReport();
  }

  function isProduced(row){
    return (row.Produced || '').trim().toLowerCase() === 'yes';
  }

  function getAllPillars(){
    const known = Object.keys(PILLAR_TARGETS);
    const extra = Array.from(new Set(allRows.map(r => r.Pillar).filter(p => p && !known.includes(p))));
    return [...known, ...extra];
  }

  // --- in-app editing (Pillar / Status / Produced only) ---
  // No password gate — anyone with this page's URL can change these three
  // fields directly. The only safety net is server-side: Code.gs's
  // EDITABLE_FIELDS whitelist means this action can never touch the actual
  // script content (Hook/Problem/Solution/etc), only these three fields.
  async function updateField(topic, field, value, selectEl){
    if (selectEl) selectEl.disabled = true;
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'update', topic, field, value }),
      });
      const result = await res.json();
      if (result.error) {
        alert('Update failed: ' + result.error);
        await loadData();
        return;
      }
      const row = allRows.find(r => r.Topic === topic);
      if (row) row[field] = value;
      render();
      if (document.getElementById('reportView').style.display !== 'none') renderReport();
    } catch (err) {
      alert('Could not reach the server: ' + err.message);
      await loadData();
    } finally {
      if (selectEl) selectEl.disabled = false;
    }
  }

  // Google Sheets serializes date cells as full UTC timestamps (e.g. a PH-local
  // midnight becomes "...T16:00:00.000Z" the day before) — always read the date
  // back out in Asia/Manila (UTC+8, no DST) so the calendar day is correct
  // regardless of the viewer's browser timezone.
  function parseDateParts(value){
    if (!value) return null;
    const str = String(value);
    const plain = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (plain) return { year:+plain[1], month:+plain[2], day:+plain[3] };
    const dt = new Date(str);
    if (isNaN(dt.getTime())) return null;
    const shifted = new Date(dt.getTime() + 8 * 60 * 60 * 1000);
    return { year: shifted.getUTCFullYear(), month: shifted.getUTCMonth() + 1, day: shifted.getUTCDate() };
  }

  function formatDateDisplay(value){
    const p = parseDateParts(value);
    if (!p) return '';
    return `${MONTH_NAMES[p.month - 1]} ${p.day}, ${p.year}`;
  }

  function monthKey(value){
    const p = parseDateParts(value);
    if (!p) return '';
    return `${p.year}-${String(p.month).padStart(2, '0')}`;
  }

  function monthLabel(key){
    const [y, m] = key.split('-');
    return `${MONTH_NAMES[+m - 1]} ${y}`;
  }

  function tt(){
    var r=document.documentElement;
    var cur=r.getAttribute('data-theme');
    if(!cur){cur=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
    r.setAttribute('data-theme',cur==='dark'?'light':'dark');
  }

  function setStatus(msg, isError){
    const el = document.getElementById('statusLine');
    el.textContent = msg;
    el.classList.toggle('error', !!isError);
  }

  async function loadData(){
    setStatus('Fetching data...');
    try {
      const res = await fetch(API_URL, { cache: 'no-store' });
      const text = await res.text();
      const json = JSON.parse(text);
      if (json.error) { setStatus('Error from Apps Script: ' + json.error, true); return; }
      allRows = json;
      setStatus('Loaded ' + allRows.length + ' script(s). Last refreshed: ' + new Date().toLocaleTimeString());
      renderStatusPills();
      renderProducedPills();
      renderMonthFilter();
      render();
      renderReport();
    } catch (err) {
      setStatus('Could not connect to the data source. Try refreshing. (' + err.message + ')', true);
    }
  }

  function statusClass(status){
    const s = (status || '').toLowerCase();
    if (s === 'draft') return 'status-draft';
    if (s === 'approved') return 'status-approved';
    if (s === 'published') return 'status-published';
    return '';
  }

  function escapeHtml(str){
    return (str || '').toString()
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function matchesFilter(row){
    const s = (row.Status || '').trim();
    let statusOk;
    if (activeStatus === 'all') statusOk = true;
    else if (activeStatus === 'approved_published') statusOk = (s === 'Approved' || s === 'Published');
    else statusOk = (s === activeStatus);

    const pillarOk = (activePillar === 'all') || ((row.Pillar || '') === activePillar);
    const monthOk = (activeMonth === 'all') || (monthKey(row['Date Added']) === activeMonth);
    const producedOk = (activeProduced === 'all') || (isProduced(row) === (activeProduced === 'yes'));

    const search = document.getElementById('searchBox').value.trim().toLowerCase();
    const searchOk = !search || (row.Topic || '').toLowerCase().includes(search) || (row.Pillar || '').toLowerCase().includes(search);

    return statusOk && pillarOk && monthOk && producedOk && searchOk;
  }

  function renderMonthFilter(){
    const select = document.getElementById('monthFilter');
    const months = Array.from(new Set(allRows.map(r => monthKey(r['Date Added'])).filter(Boolean)));
    months.sort().reverse();
    const prev = activeMonth;
    select.innerHTML = `<option value="all">All Months</option>` +
      months.map(m => `<option value="${m}">${monthLabel(m)}</option>`).join('');
    activeMonth = months.includes(prev) ? prev : 'all';
    select.value = activeMonth;
  }

  function renderStatusPills(){
    const wrap = document.getElementById('statusPills');
    wrap.innerHTML = STATUS_OPTIONS.map(o =>
      `<button class="pill ${activeStatus === o.val ? 'active' : ''}" data-val="${o.val}">${escapeHtml(o.label)}</button>`
    ).join('');
    wrap.querySelectorAll('.pill').forEach(btn => {
      btn.addEventListener('click', () => { activeStatus = btn.dataset.val; renderStatusPills(); render(); });
    });
  }

  function renderProducedPills(){
    const wrap = document.getElementById('producedPills');
    wrap.innerHTML = PRODUCED_OPTIONS.map(o =>
      `<button class="pill ${activeProduced === o.val ? 'active' : ''}" data-val="${o.val}">${escapeHtml(o.label)}</button>`
    ).join('');
    wrap.querySelectorAll('.pill').forEach(btn => {
      btn.addEventListener('click', () => { activeProduced = btn.dataset.val; renderProducedPills(); render(); });
    });
  }

  function renderSidebar(){
    // per-pillar count = Approved + Published rows for that pillar, out of its target
    const wrap = document.getElementById('pillarList');
    const pillars = Object.keys(PILLAR_TARGETS);
    wrap.innerHTML = pillars.map(p => {
      const count = allRows.filter(r => r.Pillar === p && (r.Status === 'Approved' || r.Status === 'Published')).length;
      const target = PILLAR_TARGETS[p];
      const pct = target ? Math.min(100, Math.round((count / target) * 100)) : 0;
      return `
        <button class="pillar-row ${activePillar === p ? 'active' : ''}" data-pillar="${escapeHtml(p)}">
          <span class="row1"><span class="pname">${escapeHtml(p)}</span><span class="pcount">${count}/${target}</span></span>
          <span class="pbar"><span class="pbar-fill" style="width:${pct}%"></span></span>
        </button>`;
    }).join('');
    wrap.querySelectorAll('.pillar-row').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = btn.dataset.pillar;
        activePillar = (activePillar === p) ? 'all' : p;
        render();
      });
    });

    const progressCount = allRows.filter(r => (r.Status === 'Approved' || r.Status === 'Published')).length;
    const pct = Math.min(100, (progressCount / MONTHLY_TARGET) * 100);
    const circumference = 144.5;
    document.getElementById('ringFill').style.strokeDashoffset = circumference - (circumference * pct / 100);
    document.getElementById('ringNum').textContent = progressCount + '/' + MONTHLY_TARGET;
  }

  function parseShotlist(text){
    return (text || '').split('\n').filter(Boolean).map(line => {
      const idx = line.indexOf(' — ');
      if (idx === -1) return { time:'', desc: line.trim() };
      return { time: line.slice(0, idx).trim(), desc: line.slice(idx + 3).trim() };
    });
  }

  function parseBRoll(text){
    return (text || '').split(/\n\s*\n/).filter(Boolean).map(block => {
      const idx = block.indexOf(':');
      if (idx === -1) return { label:'', desc: block.trim() };
      return { label: block.slice(0, idx).trim(), desc: block.slice(idx + 1).trim() };
    });
  }

  function phaseBlock(cls, label, time, text){
    if (!text) return '';
    return `
      <div class="phase ${cls}">
        <div class="phase-head"><span class="phase-label">${label}</span><span class="phase-time">${time}</span></div>
        <p class="phase-text">${escapeHtml(text)}</p>
      </div>`;
  }

  function render(){
    if (!allRows.length) return;
    renderSidebar();

    const openTopics = new Set(
      Array.from(document.querySelectorAll('.script-card[open]')).map(d => d.dataset.topic)
    );

    const filtered = allRows.filter(matchesFilter);

    const byPillar = {};
    filtered.forEach(r => {
      const p = r.Pillar || 'No Pillar';
      if (!byPillar[p]) byPillar[p] = [];
      byPillar[p].push(r);
    });

    const container = document.getElementById('content');
    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty-state">No matching scripts. Try changing the filter or search.</div>';
      return;
    }

    const editPillars = getAllPillars();
    const pillarOptionsHtml = (selected) => editPillars.map(p =>
      `<option value="${escapeHtml(p)}" ${p === selected ? 'selected' : ''}>${escapeHtml(p)}</option>`
    ).join('');
    const statusOptionsHtml = (selected) => ['Draft', 'Approved', 'Published'].map(s =>
      `<option value="${s}" ${s === selected ? 'selected' : ''}>${s}</option>`
    ).join('');
    const producedOptionsHtml = (selected) => ['No', 'Yes'].map(v =>
      `<option value="${v}" ${v === selected ? 'selected' : ''}>${v}</option>`
    ).join('');

    let html = '';
    Object.keys(byPillar).sort().forEach(pillar => {
      const rows = byPillar[pillar];
      html += `<h2 class="pillar-head">${escapeHtml(pillar)} <span class="pillar-count-tag">${rows.length} script</span></h2>`;
      rows.forEach(r => {
        const shots = parseShotlist(r.Shotlist);
        const panels = parseBRoll(r['B-Roll Prompts']);
        const topicAttr = escapeHtml(r.Topic);

        html += `
        <details class="script-card" data-topic="${topicAttr}">
          <summary>
            <div class="summary-top">
              <span class="summary-title">${escapeHtml(r.Topic)}</span>
              <span class="summary-meta">
                <span class="tag ${statusClass(r.Status)}">${escapeHtml(r.Status || 'n/a')}</span>
                <span class="produced-badge ${isProduced(r) ? 'is-yes' : 'is-no'}">${isProduced(r) ? '&#10003; Produced' : '&#9675; Not Produced'}</span>
                <span class="date-tag">${escapeHtml(formatDateDisplay(r['Date Added']))}</span>
                <span class="plus"></span>
              </span>
            </div>
          </summary>
          <div class="body">
            <div class="edit-row" onclick="event.stopPropagation()">
              <label>Pillar
                <select class="edit-field" data-field="Pillar">${pillarOptionsHtml(r.Pillar)}</select>
              </label>
              <label>Status
                <select class="edit-field" data-field="Status">${statusOptionsHtml(r.Status)}</select>
              </label>
              <label>Produced
                <select class="edit-field" data-field="Produced">${producedOptionsHtml(isProduced(r) ? 'Yes' : 'No')}</select>
              </label>
            </div>
            ${phaseBlock('p-hook', 'Hook', '0-3s', r.Hook)}
            ${phaseBlock('p-problem', 'Problem', '3-10s', r.Problem)}
            ${phaseBlock('p-solution', 'Solution', '10-40s', r.Solution)}
            ${phaseBlock('p-outro', 'Outro / CTA', '40-50s', r['Outro CTA'])}

            ${shots.length ? `
            <h3 class="seg">Shotlist</h3>
            <div class="shotlist">
              ${shots.map(s => `<div class="shot-row"><span class="shot-time mono">${escapeHtml(s.time)}</span><span class="shot-desc">${escapeHtml(s.desc)}</span></div>`).join('')}
            </div>` : ''}

            ${panels.length ? `
            <h3 class="seg">B-Roll Prompts</h3>
            ${panels.map(p => `
              <div class="broll-panel">
                ${p.label ? `<div class="broll-label">${escapeHtml(p.label)}</div>` : ''}
                <p class="broll-text">${escapeHtml(p.desc)}</p>
              </div>`).join('')}` : ''}

            ${r.Caption ? `<h3 class="seg">Caption</h3><div class="caption-box">${escapeHtml(r.Caption)}</div>` : ''}

            ${(r['Thumb Main Visual'] || r['Thumb Background'] || r['Thumb Text Overlay'] || r['Thumb Logo']) ? `
            <h3 class="seg">Thumbnail Asset</h3>
            <div class="thumb-box">
              ${r['Thumb Main Visual'] ? `<div class="thumb-row"><span class="thumb-key mono">Main Visual</span><span class="thumb-val">${escapeHtml(r['Thumb Main Visual'])}</span></div>` : ''}
              ${r['Thumb Background'] ? `<div class="thumb-row"><span class="thumb-key mono">Background</span><span class="thumb-val">${escapeHtml(r['Thumb Background'])}</span></div>` : ''}
              ${r['Thumb Text Overlay'] ? `<div class="thumb-row"><span class="thumb-key mono">Text Overlay</span><span class="thumb-val">${escapeHtml(r['Thumb Text Overlay'])}</span></div>` : ''}
              ${r['Thumb Logo'] ? `<div class="thumb-row"><span class="thumb-key mono">Brand Logo</span><span class="thumb-val">${escapeHtml(r['Thumb Logo'])}</span></div>` : ''}
            </div>` : ''}
          </div>
        </details>`;
      });
    });
    container.innerHTML = html;
    container.querySelectorAll('.script-card').forEach(card => {
      if (openTopics.has(card.dataset.topic)) card.setAttribute('open', '');
      card.querySelectorAll('.edit-field').forEach(sel => {
        sel.addEventListener('change', () => updateField(card.dataset.topic, sel.dataset.field, sel.value, sel));
      });
    });
  }

  function renderReport(){
    if (!allRows.length) return;

    const months = Array.from(new Set(allRows.map(r => monthKey(r['Date Added'])).filter(Boolean))).sort().reverse();
    if (!months.includes(reportMonth)) reportMonth = months[0] || 'all';
    const monthSelect = document.getElementById('reportMonthFilter');
    monthSelect.innerHTML = months.length
      ? months.map(m => `<option value="${m}">${monthLabel(m)}</option>`).join('')
      : `<option value="all">No data</option>`;
    monthSelect.value = reportMonth;

    const allPillars = getAllPillars();
    const pillarSelect = document.getElementById('reportPillarFilter');
    pillarSelect.innerHTML = `<option value="all">All Pillars</option>` +
      allPillars.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
    pillarSelect.value = reportPillar;

    const body = document.getElementById('reportBody');
    const rowsInMonth = allRows.filter(r => reportMonth === 'all' || monthKey(r['Date Added']) === reportMonth);
    if (!rowsInMonth.length) {
      body.innerHTML = '<div class="empty-state">No scripts logged for this month yet.</div>';
      return;
    }

    const pillarsToShow = reportPillar === 'all' ? allPillars : [reportPillar];

    let totalProduced = 0, totalLogged = 0;
    let html = '<div class="report-table">';
    pillarsToShow.forEach(p => {
      const rows = rowsInMonth.filter(r => r.Pillar === p);
      const produced = rows.filter(isProduced).length;
      const logged = rows.length;
      totalProduced += produced;
      totalLogged += logged;
      const pct = logged ? Math.round((produced / logged) * 100) : 0;
      html += `
        <div class="report-row">
          <span class="report-pname">${escapeHtml(p)}</span>
          <span class="report-bar-track"><span class="report-bar-fill" style="width:${pct}%"></span></span>
          <span class="report-nums">${produced} / ${logged} produced</span>
        </div>`;
    });
    if (pillarsToShow.length > 1) {
      const totalPct = totalLogged ? Math.round((totalProduced / totalLogged) * 100) : 0;
      html += `
        <div class="report-row total">
          <span class="report-pname">All Pillars</span>
          <span class="report-bar-track"><span class="report-bar-fill" style="width:${totalPct}%"></span></span>
          <span class="report-nums">${totalProduced} / ${totalLogged} produced</span>
        </div>`;
    }
    html += '</div>';
    body.innerHTML = html;
  }

  // Auto-fetch immediately on page load — no setup step needed.
  window.addEventListener('DOMContentLoaded', loadData);
</script>

</body>
</html>
